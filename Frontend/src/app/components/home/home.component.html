<div class="px-20">

  <div class="container mt-4">
    <owl-carousel-o [options]="customOptions">
      @for (item of bannerImages; track $index) {
      <ng-template carouselSlide>
        <div class="carousel-item text-center" [routerLink]="'product/' + item._id">
          <img [src]="item.images[0]" alt="images" class="img-fluid mx-auto"
            style="width: 100%; height: 400px; object-fit: cover;" />
          <div class="carousel-caption d-none d-md-block">
            <h5 style="font-weight: bold;">{{item.name}}</h5>
          </div>
        </div>
      </ng-template>
      }
    </owl-carousel-o>
  </div>
@if(featuredProducts){


  <div class="mt-4">
    <h4 class="text-2xl font-bold">Featured Products</h4>
    <div class="flex flex-wrap gap-4 justify-between">
      @for (product of featuredProducts; track $index) {
      <div class="product-card">
  
        <app-product-card [product]="product"></app-product-card>
      </div>
      }
    </div>
  </div>

}


@if(newProducts){
  <div class="mt-4">
    <h4 class="text-2xl font-bold">New Products</h4>
    <div class="flex flex-wrap gap-4 justify-between">
      @for (product of newProducts; track $index) {
      <div class="product-card">
   
        <app-product-card [product]="product"></app-product-card>
      </div>
      }
    </div>
  </div>
}
</div>
