<div class="login-wrapper">
  <!-- Left Section: Image -->
  <div class="login-image-section">
    <img src="https://ebz-static.s3.ap-south-1.amazonaws.com/easebuzz-static/upi-credit-cards-v1.png" alt="Login Visual" />
  </div>

<!-- Right Section: Login Form -->
<div class="login-form-section">
  <div class="login-card">
    <!-- Branded Title -->
    <h1 class="brand-title">Desi<span class="highlight">Dealz</span></h1>
    <p class="brand-subtitle">Welcome back! Please login to continue.</p>

    <h2 class="login-title">Login</h2>

    <form [formGroup]="loginForm">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Password Field with Toggle -->
      <div class="form-group password-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
          />
          <span class="material-icons toggle-password" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </div>
      </div>



<div class="form-group remember-forgot">
  <label class="remember-me">
    <input type="checkbox" id="rememberMe" formControlName="rememberMe" />
    Remember Me
  </label>
  <a routerLink="/forgot-password" class="forgot-password-link">
    Forgot Password?
  </a>
</div>

      <!-- Login Button -->
      <div>
        <button type="submit" class="login-button" (click)="login()" [disabled]="loginForm.invalid">
          Login
        </button>
      </div>

      <!-- Register Link -->
      <div class="register-link">
        Don’t have an account? <a routerLink="/register">Register here</a>
      </div>
    </form>
  </div>
</div>


</div>
