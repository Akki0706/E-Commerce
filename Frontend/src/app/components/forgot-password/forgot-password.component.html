<div class="login-wrapper">
  <!-- Left Section: Image -->
  <div class="login-image-section">
    <img src="https://ebz-static.s3.ap-south-1.amazonaws.com/easebuzz-static/upi-credit-cards-v1.png" alt="Login Visual" />
  </div>

  <!-- Right Section: Forgot Password Form -->
  <div class="login-form-section">
    <div class="login-card">
      <!-- Branded Title -->
      <h1 class="brand-title">Desi<span class="highlight">Dealz</span></h1>
      <p class="brand-subtitle">Don't worry! Enter your email and we'll send you a reset link.</p>

      <h2 class="login-title">Forgot Password</h2>

      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email address"
            [(ngModel)]="email"
            required
            email
            [disabled]="isLoading"
          />
        </div>

        <!-- Submit Button -->
        <div>
          <button 
            type="submit" 
            class="login-button" 
            [disabled]="!forgotForm.valid || isLoading"
          >
            <span *ngIf="isLoading">Sending...</span>
            <span *ngIf="!isLoading">Send Reset Link</span>
          </button>
        </div>

        <!-- Success/Error Messages -->
        <div *ngIf="message" class="success-message">
          {{ message }}
        </div>
        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <!-- Back to Login Link -->
        <div class="register-link">
          Remember your password? <a [routerLink]="['/login']">Back to Login</a>

        </div>
      </form>
    </div>
  </div>
</div>
