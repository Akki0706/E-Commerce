<div class="container">
    <button mat-raised-button color="warn" class="mr-2" (click)="goBack()">
        Back
      </button>
    <div class="header">
        <h1>{{isEdit ? 'Update Brand' : 'Add New Category'}}</h1>
    </div>
    <form class="form-container">
        <div class="form-content">
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" [(ngModel)]="name" name="name">
            </div>
            <div class="button-container">
                <button 
                    class="primary-button" 
                    [class.disabled]="!name" 
                    [disabled]="!name" 
                    (click)="isEdit ? update() : add()">
                    {{isEdit ? 'Update' : 'Add'}}
                </button>
            </div>
        </div>
    </form>
</div>
