<div class="flex flex-col items-center px-40 mt-10">
    <!-- Header Section -->
    <div class="w-full max-w-xl bg-white shadow-md rounded-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <button mat-raised-button color="warn" class="mr-2" (click)="goBack()">
          Back
        </button>
        <h1 class="text-2xl font-semibold">
          {{ isEdit ? 'Update Category' : 'Add New Category' }}
        </h1>
      </div>
  
      <!-- Form Section -->
      <form class="w-full">
        <mat-form-field class="w-full">
          <mat-label>Category Name</mat-label>
          <input matInput type="text" [(ngModel)]="name" name="name" required />
        </mat-form-field>
  
        <div class="flex justify-center mt-6">
          <button
            mat-raised-button
            color="primary"
            class="w-full"
            [disabled]="!name"
            (click)="isEdit ? update() : add()"
          >
            {{ isEdit ? 'Update' : 'Add' }}
          </button>
        </div>
      </form>
    </div>
  </div>
