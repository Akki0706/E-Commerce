<div class="products-container">
  <div class="products-wrapper">

    <div class="header-card">
      <div class="header-content">
        <div class="header-left">
          <button 
            mat-raised-button 
            color="warn" 
            class="back-button"
            (click)="goBack()">
            <!-- <mat-icon class="button-icon">arrow_back</mat-icon> -->
            Back
          </button>
          <div>
            <h1 class="page-title">
              Manage Products
            </h1>
          </div>
        </div>
        
        <button
          mat-raised-button
          color="primary"
          class="add-product-button"
          routerLink="/admin/products/add">
          <mat-icon class="button-icon">add_circle</mat-icon>
          Add New Product
        </button>
      </div>
    </div>

    <div class="table-main-container">

      <div class="search-section">
        <mat-form-field class="search-field">
          <mat-label class="search-label">Search Products</mat-label>
          <input
            matInput
            (keyup)="applyFilter($event)"
            placeholder="Type to search products..."
            class="search-input"
            #input
          />
          <mat-icon matSuffix class="search-icon">search</mat-icon>
        </mat-form-field>
      </div>

      <div class="table-scroll-container">
        <table mat-table [dataSource]="dataSource" matSort class="products-table">
          
          <!-- ID Column -->
          <!-- <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
              ID
            </th>
            <td mat-cell *matCellDef="let row" class="table-cell">
              <span class="id-badge">
                {{ row._id }}
              </span>
            </td>
          </ng-container> -->
          <ng-container matColumnDef="serialNumber">
  <th mat-header-cell *matHeaderCellDef class="table-header">S.No.</th>
  <td mat-cell *matCellDef="let row; let i = index" class="table-cell">
    {{ i + 1 }}
  </td>
</ng-container>
  

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
              Product Name
            </th>
            <td mat-cell *matCellDef="let row" class="table-cell">
              <div class="product-name-container">
                <div class="product-icon-wrapper">
                  <mat-icon  class="product-icon">inventory</mat-icon>
                </div>
                {{ row.name }}
              </div>
            </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="shotDescription">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
              Description
            </th>
            <td mat-cell *matCellDef="let row" class="table-cell description-cell">
              <span class="description-text">{{ row.shotDescription }}</span>
            </td>
          </ng-container>

          <!-- Price Column -->
          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
              Price
            </th>
            <td mat-cell *matCellDef="let row" class="table-cell">
              <span class="price-badge">
                ₹{{ row.price }}
              </span>
            </td>
          </ng-container>

          <!-- Discount Column -->
          <ng-container matColumnDef="discount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
              Discount
            </th>
            <td mat-cell *matCellDef="let row" class="table-cell">
              <span class="discount-badge">
                {{ row.discount }}%
              </span>
            </td>
          </ng-container>

          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="table-header">
              Actions
            </th>
            <td mat-cell *matCellDef="let row" class="table-cell">
              <div class="action-buttons">
                <button
                  mat-raised-button
                  color="accent"
                  class="edit-action-button"
                  [routerLink]="'/admin/products/' + row._id">
                  <mat-icon class="action-icon">edit</mat-icon>
                  Edit
                </button>
                <button 
                  mat-raised-button 
                  color="warn" 
                  class="delete-action-button"
                  (click)="delete(row._id)">
                  <mat-icon class="action-icon">delete</mat-icon>
                  Delete
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="table-header-row"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-data-row"></tr>

          <!-- No Data Row -->
          <tr class="no-data-row" *matNoDataRow>
            <td class="no-data-cell" [attr.colspan]="displayedColumns.length">
              <div class="no-data-content">
                <mat-icon class="no-data-icon">search_off</mat-icon>
                <p class="no-data-title">No products found</p>
                <p class="no-data-subtitle">
                  No data matching the filter "<strong>{{ input.value }}</strong>"
                </p>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <div class="paginator-section">
        <mat-paginator
          [pageSizeOptions]="[5, 10, 25, 100]"
          aria-label="Select page"
          class="custom-paginator">
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
