<div class="reviews-section">
  <h2 class="reviews-title">Product Reviews</h2>

  <div *ngIf="reviews.length > 0" class="reviews-list">
    <div *ngFor="let review of reviews" class="review-card">
      <div class="review-header">
        <h3 class="reviewer-name">{{ review.reviewer }}</h3>
        <div class="star-rating">
          <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
            <i [ngClass]="i < review.rating ? 'fas fa-star star-filled' : 'far fa-star star-empty'"></i>
          </ng-container>
        </div>
      </div>
      <p class="review-comment">{{ review.comment }}</p>
      <p class="review-date">{{ review.createdAt | date : "medium" }}</p>
    </div>
  </div>

  <div *ngIf="reviews.length === 0" class="no-reviews">
    No reviews yet. Be the first to review!
  </div>

  <div class="review-form-section">
    <h3 class="form-title">Write a Review</h3>
    <form [formGroup]="reviewForm" (ngSubmit)="submitReview()" class="review-form">
      <div class="form-group">
        <input
          formControlName="reviewer"
          type="text"
          placeholder="Your name"
          required
          class="form-input"
          [ngClass]="{'invalid': reviewForm.get('reviewer')?.invalid && reviewForm.get('reviewer')?.touched}"
        />
      </div>

      <div class="form-group">
        <select formControlName="rating" class="form-select">
          <option value="">Select Rating</option>
          <option *ngFor="let star of [1, 2, 3, 4, 5]" [value]="star">
            {{ star }} Star(s)
          </option>
        </select>
      </div>

      <div class="form-group">
        <textarea
          formControlName="comment"
          placeholder="Share your experience with this product..."
          required
          class="form-textarea"
          [ngClass]="{'invalid': reviewForm.get('comment')?.invalid && reviewForm.get('comment')?.touched}"
        ></textarea>
      </div>

      <div class="form-group">
        <button type="submit" class="submit-button" [disabled]="reviewForm.invalid">
          Submit Review
        </button>
      </div>
    </form>
  </div>
</div>
