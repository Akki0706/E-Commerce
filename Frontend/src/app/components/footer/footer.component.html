<footer class="footer">
  <div class="footer-content">
    <div class="footer-section">
      <h4>Company</h4>
      <ul>
        <li><a href="/about">About Us</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/careers">Careers</a></li>
      </ul>
    </div>

    <div class="footer-section">
      <h4>Support</h4>
      <ul>
        <li><a href="/help">Help Center</a></li>
        <li><a href="/returns">Returns</a></li>
        <li><a href="/faq">FAQs</a></li>
      </ul>
    </div>

    <div class="footer-section">
      <h4>Social Media</h4>
      <ul>
        <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
        <li><a href="https://twitter.com" target="_blank">Twitter</a></li>
        <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
      </ul>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; 2024 E-Commerce Website. All Rights Reserved.</p>
  </div>

  <!-- 💬 Chatbot Icon -->
  <div class="chatbot-icon"
  matTooltip="Chat with our AI assistant"
  matTooltipPosition="above"
  *ngIf="!isChatOpen" (click)="toggleChatbot()">
    💬
  </div>

  <!-- 🧠 Chatbot Window -->
  <div class="chatbot-window" *ngIf="isChatOpen" [class.active]="isChatOpen">
    <div class="chat-header">
      <h4>AI Chatbot</h4>
      <span class="close" (click)="toggleChatbot()">✖</span>
    </div>
    <div class="chat-body" #chatBody>
      <div *ngFor="let msg of messages" [class.user]="msg.sender === 'user'" [class.bot]="msg.sender === 'bot'">
        {{ msg.text }}
      </div>
    </div>
    <div class="chat-input">
      <input type="text" placeholder="Type your message..." [(ngModel)]="userMessage" (keyup.enter)="sendMessage()" />
      <button (click)="sendMessage()">Send</button>
    </div>
  </div>
</footer>
